# Automated dependency updates (issue #128).
#
# Ecosystems:
#   * bun            — package.json + bun.lock (CI installs with
#                      `bun install --frozen-lockfile`, so the JS deps must be
#                      driven through Bun, not npm, to keep the lockfile in
#                      sync). Requires Dependabot's Bun support (bun >= 1.1.39).
#   * github-actions — refreshes the SHA pins from #129 and their version
#                      comments together.
#   * docker         — the oven/bun base image in the Dockerfile.
#   * cargo          — src-tauri/Cargo.toml. Cargo.lock is gitignored and the
#                      requirements are major-only ("2", "1"), so every build
#                      already resolves the latest compatible release; this
#                      ecosystem only surfaces new majors (Tauri 3, …).
#
# Every update — majors included — is grouped into a single weekly PR per
# ecosystem to keep the review load low. Omitting `update-types` from a group
# is what pulls majors in; splitting them out again just means three or four
# PRs land the same morning, and the breaking change gets read no more closely
# for having its own branch. Read the group PR's changelog table instead.
version: 2
# @open-ocpp-trace/* is on GitHub Packages (bunfig.toml, #886), which wants a
# token even for a public package. Dependabot does not get the workflow
# token, so the repository's Dependabot secret DEPENDABOT_PACKAGES_TOKEN
# holds a token with read:packages.
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.DEPENDABOT_PACKAGES_TOKEN}}
updates:
  - package-ecosystem: "bun"
    directory: "/"
    registries:
      - github-packages
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint 8.x hard-errors on TS 7 ("typescript-eslint does not
      # support TS 7.0."), so a typescript major fails lint and — now that
      # majors ride in the group PR — takes the whole weekly batch red with it.
      # Minor and patch bumps still flow. Drop this once typescript-eslint
      # ships TS 7 support.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      js-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        patterns:
          - "*"
