name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      # The desktop release compiles the CLI into a Tauri sidecar with
      # `bun build --compile`, and that is the ONLY thing here that resolves
      # every import: the runtime elides type-only ones, so a wrong path in
      # an `import type` (or in a value import used only as a type) is
      # invisible to lint and to both test runners. Three such imports in
      # MessageHandlerRegistry.ts broke the v0.7.6 and v0.7.7 desktop builds
      # and were noticed only after the releases were out (#281). Compiling
      # for the host target takes seconds and fails the same way the release
      # would, on the pull request instead of on the tag.
      - name: CLI sidecar compiles (release smoke)
        run: bun build --compile --outfile=/tmp/ocpp-cp-sim-smoke src/cli/main.ts

      # No CI job used to touch the npm tarball at all — the only checks on it
      # lived in cli-release.yml and ran on the `cli-v*` tag, so a PR that
      # broke packaging stayed green and the breakage surfaced weeks later at
      # release time. It did: package.json#files lost track of src/data,
      # src/ocpp, src/trace and vendor/, and the published CLI could not run
      # (#320). Pack it and boot it here, on the pull request.
      #
      # Packed with --ignore-scripts, so no vite build and no dist/ — the
      # script skips its web-console stage for exactly that reason and does
      # not fail on it. Do NOT add a vite build here to "fix" the skip; the
      # release workflow builds dist/ and passes --expect-dist, which is where
      # a missing "dist" entry is caught.
      - name: CLI tarball installs and runs (packaging smoke)
        run: ./scripts/verify-cli-tarball.sh

      # The install command in README.md, docs/entities/cli.md and the release
      # notes cli-release.yml generates must all be the same, working URL.
      # `releases/latest/download/...` is banned outright: GitHub resolves
      # "latest" across both tag trains in this repo (`v*` desktop and
      # `cli-v*` CLI), so it points at a desktop release — which ships no
      # `.tgz` — for roughly half of every release cycle, and the documented
      # command 404s (#321). The rolling `cli-latest` pre-release that
      # cli-release.yml maintains is scoped to the CLI train instead.
      #
      # This is a consistency check, not a liveness check: fetching the URL
      # for real would make CI depend on the release history, so that lives in
      # cli-release.yml's "Verify the documented install URL" step, right
      # after the upload that creates it.
      - name: Documented install URL is consistent
        run: |
          set -uo pipefail
          URL="releases/download/cli-latest/ocpp-cp-simulator.tgz"
          rc=0
          for f in README.md docs/entities/cli.md .github/workflows/cli-release.yml; do
            grep -q "$URL" "$f" || {
              echo "::error file=$f::does not carry the canonical install URL ($URL)"
              rc=1
            }
          done
          # Ban the old form, but only where it is an actual advertised
          # command — prose that explains why it was dropped (this comment
          # included) must stay greppable without tripping the guard.
          # `git grep` searches tracked files only, so a stray tarball or a
          # node_modules copy cannot trip it either.
          if git grep -nE 'install -g https://github\.com/[^ ]*/releases/latest/download' -- '*.md' .github; then
            echo "::error::that URL resolves across both tag trains and 404s for half of every release cycle (#321); use $URL"
            rc=1
          fi
          exit $rc

      - name: Unit tests (vitest)
        run: bun run test:vitest

      - name: Runtime tests (bun)
        run: bun run test:bun

      - name: Coverage (non-blocking)
        run: bun run test:coverage
        continue-on-error: true
        if: ${{ !cancelled() }}

      - name: Coverage (non-blocking, bun)
        run: bun run test:coverage:bun
        continue-on-error: true
        if: ${{ !cancelled() }}

      # Coverage + test-results reporting (issue #131). Both are non-blocking
      # (fail_ci_if_error: false) and run even when a test step failed, so a
      # red build still publishes its numbers. Needs a CODECOV_TOKEN repo
      # secret; without it the upload is skipped rather than failing CI.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info,./coverage/bun/lcov.info
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/junit.xml
          fail_ci_if_error: false
