name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request makes the run for the previous push useless:
# cancel it. Runs on main are never cancelled, so every merge commit is tested.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Static checks and the packaging smokes. The test suites run in the jobs
  # below, in parallel: they used to run one after the other here, and then a
  # second time for coverage, which made this job about 18 minutes long.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The install-URL step diffs the pull request against its base.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # #578: the repository is a Bun workspace (packages/*, apps/*), and the
      # dependency rules between the packages are executable:
      # scripts/check-package-boundaries.ts maps every file under packages/ and
      # apps/ to its package and fails on an import the package may not have
      # (type-only imports included), on a cross-package import that is not an
      # @ocpp-cp-simulator/<package> specifier, on a package.json whose workspace:*
      # dependencies differ from what the package imports, or on a UI / Node /
      # Bun-only specifier in a package that must run in both Bun and the
      # browser. #570: it also fails on a cycle of static value imports.
      - name: Package boundaries
        run: bun run check:boundaries

      - name: Format check
        run: bun run format:check

      # Neither Vite nor Bun type-checks: both strip the types and run, so type
      # errors shipped unnoticed until the code base carried ~380 of them, some
      # of them real bugs (#374). `tsc -b` checks every project the root
      # tsconfig.json references (each package and app, vite config, bench
      # scripts); any error fails the build. (Not `--noEmit`: project
      # references need the referenced projects to emit declarations, which go
      # to node_modules/.tmp.)
      - name: Typecheck
        run: bun run typecheck

      # The desktop release compiles the CLI into a Tauri sidecar with
      # `bun build --compile`, and that is the ONLY thing here that resolves
      # every import: the runtime elides type-only ones, so a wrong path in
      # an `import type` (or in a value import used only as a type) is
      # invisible to lint and to both test runners. Three such imports in
      # MessageHandlerRegistry.ts broke the v0.7.6 and v0.7.7 desktop builds
      # and were noticed only after the releases were out (#281). Compiling
      # for the host target takes seconds and fails the same way the release
      # would, on the pull request instead of on the tag.
      - name: CLI sidecar compiles (release smoke)
        run: bun build --compile --outfile=/tmp/ocpp-cp-sim-smoke apps/cli/src/main.ts

      # No CI job used to touch the npm tarball at all — the only checks on it
      # lived in cli-release.yml and ran on the `cli-v*` tag, so a PR that
      # broke packaging stayed green and the breakage surfaced weeks later at
      # release time. It did: package.json#files lost track of src/data,
      # src/ocpp, src/trace and vendor/, and the published CLI could not run
      # (#320). Pack it and boot it here, on the pull request. (The package
      # is a single bundle now, but the root package.json also carries the
      # "workspaces" field; the script checks that bun and npm still install
      # the packed manifest outside the repository.)
      #
      # Packed with --ignore-scripts, so no vite build and no dist/ — the
      # script skips its web-console stage for exactly that reason and does
      # not fail on it. Do NOT add a vite build here to "fix" the skip; the
      # release workflow builds dist/ and passes --expect-dist, which is where
      # a missing "dist" entry is caught. The script does build the CLI
      # bundle (dist-cli/main.js) itself: that is the `bin` the tarball ships.
      - name: CLI tarball installs and runs (packaging smoke)
        run: ./scripts/verify-cli-tarball.sh

      # #321: the documented install command must actually run. The first
      # version of this guard only asserted that the places restating the URL
      # agreed with each other — which is worthless, since several places
      # agreeing on a broken URL is exactly the state the issue describes. The
      # script fetches every install command README.md and docs/entities/cli.md
      # advertise and fails if one does not return 200. Needs network access to
      # github.com, and has a short retry so a blip is not a red build; a 404
      # fails immediately.
      #
      # #808: the fetch depends on a GitHub release being reachable, so a
      # release outage turned every unrelated pull request red. A pull request
      # fetches only when its diff adds or removes an advertised install
      # command (the same `install -g https://` pattern the script greps for,
      # so what is checked and what triggers the check cannot drift apart) or
      # touches the release plumbing; otherwise only the offline invariants
      # run. A push to main fetches always, and install-urls.yml fetches daily
      # so a broken cli-latest is still noticed.
      - name: Documented install URLs resolve
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            ./scripts/verify-install-urls.sh
            exit
          fi
          base="origin/${BASE_REF}"
          if git diff --unified=0 "$base"...HEAD -- '*.md' \
               | grep -qE '^[+-].*(pnpm|bun|npm) install -g https://' \
             || ! git diff --quiet "$base"...HEAD -- \
                  .github/workflows/ci.yml \
                  .github/workflows/cli-release.yml \
                  .github/workflows/install-urls.yml \
                  scripts/roll-cli-latest.sh \
                  scripts/verify-install-urls.sh; then
            ./scripts/verify-install-urls.sh
          else
            echo "No install command or release plumbing changed: offline invariants only (#808)"
            ./scripts/verify-install-urls.sh --offline
          fi

  # Vitest, run once: the coverage run is the test run, and it fails the job
  # on a failing test (it used to run a second time, non-blocking, only for
  # coverage). Coverage and the JUnit report go to Codecov even when a test
  # failed, so a red build still publishes its numbers (issue #131). Needs a
  # CODECOV_TOKEN repo secret; without it the upload is skipped rather than
  # failing CI.
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests with coverage (vitest)
        run: bun run test:coverage

      # `test:bun` filters on `*.bun.test.ts`, so it never runs the whole
      # apps/cli/src/__tests__ directory in one process — and that is where the
      # two runners overlap. `bun test apps/cli/src/__tests__` is what a developer
      # types while debugging, and on a clean tree it failed, with three
      # defects stacked in client.remote.test.ts, each masked by the one
      # before (#339): it used vitest-only `vi.hoisted` and so could not even
      # load; its `vi.mock()` is process-global under bun and leaked into
      # client.socket.test.ts, which exists to drive the REAL service; and it
      # restored `process.exitCode` by assigning `undefined`, which bun
      # ignores, so the run exited 1 with every test green. Neither runner's
      # own gate saw any of it.
      #
      # Running the directory here keeps that overlap honest: every file in it
      # must load and pass under BOTH runners, which restricts it to the `vi`
      # API bun implements (fn, mock, spyOn, the *AllMocks helpers, fake
      # timers), forces any process-global module mock to be undone in an
      # afterAll, and forces process-global state to be restored with a
      # concrete value rather than `undefined`. The 7 non-`bun.test.ts` files
      # there are run twice — once by vitest for coverage/junit, once here —
      # which costs ~11s.
      - name: CLI tests, whole directory in one bun process
        if: ${{ !cancelled() }}
        run: bun run test:bun:cli

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: vitest
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/junit.xml
          fail_ci_if_error: false

  # The `test:bun` suite (every *.bun.test.ts), run once with coverage and
  # split into fixed shards by scripts/bun-test-shard.sh (files sorted and
  # dealt round-robin). Codecov merges the shards' reports for the commit.
  bun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Runtime tests with coverage (bun, shard ${{ matrix.shard }} of 3)
        run: >-
          ./scripts/bun-test-shard.sh ${{ matrix.shard }} 3
          --coverage --coverage-reporter=text --coverage-reporter=lcov
          --coverage-dir=./coverage/bun

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/bun/lcov.info
          flags: bun
          fail_ci_if_error: false

  # docker-publish.yml builds the image on pushes to `main` and on tags, not
  # on pull requests, so a change that breaks only the container build is
  # first seen after merge: a referenced tsconfig the `ui` stage did not copy
  # left v0.7.11 without an image (#302). This job builds the full image for
  # the host arch on every pull request, starts it with a charge point and
  # waits for the health endpoint and for the charge point to bootstrap, so a
  # build-time or boot-time miss fails here. The runtime image holds only the
  # CLI bundle, dist/ and the scenario examples (no node_modules), and
  # creating a charge point is what loads the OCPP validators and schemas
  # inside the bundle. One arch and no push keep it to a few minutes; the gha
  # cache is shared with docker-publish.yml, which uses the same cache
  # scope.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same Bun as docker-publish.yml: the one .tool-versions pins.
      - name: Read the Bun version
        id: bun-version
        run: |
          version="$(awk '$1=="bun"{print $2}' .tool-versions)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ocpp-cp-sim:ci
          build-args: |
            APP_COMMIT=${{ github.sha }}
            BUN_VERSION=${{ steps.bun-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The daemon comes up with one charge point (the CSMS URL is a closed
      # port on purpose: the connection fails, which is fine), serves the web
      # console and answers the health path the Dockerfile's HEALTHCHECK
      # polls. Thirty attempts a second apart, each capped at 2 s, is
      # generous: the entrypoint execs bun directly and the daemon answers
      # /v1/healthz within a second or two on the runner. The charge point
      # has to have bootstrapped as well: that is what imports the OCPP
      # validators, so a schema or module the bundle lost shows up as a
      # missing `Bootstrapped CP` line, not as a healthy empty daemon. No
      # --rm, so the failure branch can still read the logs of a container
      # that exited; the step below removes it either way.
      - name: Image boots, bootstraps a charge point and answers the health path
        run: |
          docker run -d --name ocpp-cp-sim-ci -p 9700:9700 \
            -e STATE_DB=:memory: ocpp-cp-sim:ci \
            --cp-id ci-smoke --connectors 2 --ws-url ws://127.0.0.1:9/ocpp/
          healthy=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:9700/v1/healthz; then echo; healthy=1; break; fi
            sleep 1
          done
          if [ "$healthy" != 1 ]; then
            echo "daemon did not answer /v1/healthz after 30 attempts"
            docker logs ocpp-cp-sim-ci
            exit 1
          fi
          if ! docker logs ocpp-cp-sim-ci 2>&1 | grep -q 'Bootstrapped CP "ci-smoke"'; then
            echo "daemon never bootstrapped the charge point"
            docker logs ocpp-cp-sim-ci
            exit 1
          fi

      # JSON mode without overriding the entrypoint, and the legacy
      # `--entrypoint bun src/cli/main.ts` shape open-ocpp-tck still uses
      # (#346). Each sends one command, closes stdin and expects a reply and
      # exit 0 (the CSMS URL is a closed port; the reply does not need it).
      - name: Image runs JSON mode (entrypoint and legacy shim)
        run: |
          cmd='{"id":1,"command":"status"}'
          echo "$cmd" | timeout 60 docker run -i --rm ocpp-cp-sim:ci \
            --json --cp-id ci-json --ws-url ws://127.0.0.1:9/ocpp/ | tee /tmp/json-entrypoint.out
          grep -q '"id":1' /tmp/json-entrypoint.out
          grep -q '"ok":true' /tmp/json-entrypoint.out
          echo "$cmd" | timeout 60 docker run -i --rm --entrypoint bun -w /app ocpp-cp-sim:ci \
            src/cli/main.ts --json --cp-id ci-json --ws-url ws://127.0.0.1:9/ocpp/ | tee /tmp/json-shim.out
          grep -q '"id":1' /tmp/json-shim.out
          grep -q '"ok":true' /tmp/json-shim.out

      - name: Stop the container
        if: always()
        run: docker rm -f ocpp-cp-sim-ci || true

  # The bench's teardown slow paths (#330), beside the main job rather than
  # inside `test:bun`. Each case makes a mock CSMS slow on one action and so
  # costs wall-clock by construction (~36s locally, mostly injected delays);
  # the file name avoids the `bun.test` substring `test:bun` filters on, so
  # this is the only place it runs. Same toolchain as `test`, nothing else.
  bench-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bench slow-path tests (bun)
        run: bun run test:bench-slow
