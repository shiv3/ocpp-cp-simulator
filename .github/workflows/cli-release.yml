name: Release CLI

# Builds the CLI + bundled web console and uploads an npm-style tarball
# (`ocpp-cp-simulator-<version>.tgz`) to a GitHub Release. End users then
# install with e.g.
#
#   bun install -g https://github.com/shiv3/ocpp-cp-simulator/releases/download/cli-latest/ocpp-cp-simulator.tgz
#
# or, from the npm registry, with `npm install -g ocpp-cp-simulator` — the
# `publish-npm` job below publishes the very tarball the release carries.
#
# One tag train: a `v*` tag builds the desktop app (release.yml) AND the CLI
# (this workflow) for the same release, with the same version. Before that the
# CLI had its own `cli-v*` train; those releases stay where they are.
#
# `cli-latest` is a rolling pre-release this workflow re-points at every CLI
# release (see the "rolling cli-latest pointer" step). It is kept so the install
# URL documented before the trains were unified (#321) keeps working.
#
# The tarball respects the `files` field in package.json, which lists every
# top-level directory the CLI's import graph reaches plus the freshly-built
# `dist/`. Keep it a list of DIRECTORIES: enumerating individual files is what
# shipped a tarball that could not start (#320). `dist/` is deliberately kept
# out of git — devDependencies aren't installed for global bin packages, so a
# postinstall build isn't viable, which is why we ship a prebuilt tarball.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.10.0) — attaches the CLI to the existing release v<version>"
        required: true
        type: string

permissions:
  contents: write
  packages: read

# NOTE: there is deliberately NO workflow-level `concurrency:` here. GitHub's
# concurrency cancels the *pending* run whenever a newer one enters the group,
# and `cancel-in-progress: false` only protects the run that is already
# executing — not the queue behind it. With three CLI releases queued, the
# middle tag would be cancelled and would never publish its own `v*`
# assets, which ARE the release. Only the pointer-move job below is serialised;
# see the comment on its `concurrency:` block for why cancelling that one is
# harmless.

jobs:
  # Attaches the CLI tarball to the per-tag `v*` release. Never cancellable, never gated on
  # anything else: its assets are the release.
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Setup Node (for `npm pack`)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # @open-ocpp-trace/* is on GitHub Packages (bunfig.toml).
          GITHUB_TOKEN: ${{ github.token }}

      # Stamp before the vite build: the bundle bakes package.json's version
      # into the web console label, which reads `local-dev` when unstamped.
      - name: Stamp package version
        run: npm version --no-git-tag-version --allow-same-version "${{ steps.version.outputs.version }}"

      - name: Build web console (vite)
        run: bun run build

      # The tarball ships the CLI as one `bun build` bundle (dist-cli/main.js,
      # the `bin`), not as sources: a published package must not depend on
      # the source layout (#578). `npm pack --ignore-scripts` below skips the
      # `prepack` hook that would otherwise run this.
      - name: Build CLI bundle
        run: bun run build:cli

      - name: Pack tarball
        id: pack
        run: |
          # `npm pack` reads the `files` field of package.json: `dist` (the
          # web console) and `dist-cli` (the CLI bundle). --ignore-scripts
          # skips the `prepack` hook (vite build + CLI bundle) — both were
          # built in the previous steps, and letting prepack run again
          # pollutes the captured stdout with vite's build log, which breaks
          # the $TARBALL capture below.
          TARBALL=$(npm pack --silent --ignore-scripts)
          # Also publish under a stable filename so consumers can fetch
          # `releases/download/cli-latest/ocpp-cp-simulator.tgz` and always
          # get the newest CLI without knowing the version string.
          cp "${TARBALL}" ocpp-cp-simulator.tgz
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          ls -lh "${TARBALL}" ocpp-cp-simulator.tgz

      # This used to be three `tar -tf | grep` steps asserting that named
      # files (src/protocol/, src/scenario/scenarioSchemaValidator.ts,
      # schema/scenario.schema.json) were in the listing. All three passed on
      # a tarball that could not run at all, because `files` omitted src/data,
      # src/ocpp, src/trace and vendor/ — paths no grep named (#320). A
      # presence check can only ever catch the omissions someone already
      # thought of. This installs the tarball into a throwaway global prefix
      # and boots it instead: --help, the full import graph, the daemon's
      # /v1/healthz, and the bundled web console. --expect-dist makes the
      # web-console stage mandatory here (we ran `bun run build` above, so a
      # tarball without dist/ means `files` lost it).
      - name: Verify the tarball installs and runs
        run: ./scripts/verify-cli-tarball.sh --expect-dist "${{ steps.pack.outputs.tarball }}"

      # The release itself (name, notes, "Latest" badge) belongs to the
      # drafter / desktop workflow: publishing the draft creates the `v*` tag
      # that started this run. This job only attaches the CLI assets, so it
      # waits for that release to exist (release.yml's resolve-release creates
      # it when a tag was pushed directly) instead of creating one itself, which
      # would race with it.
      - name: Attach the CLI tarball to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              break
            fi
            [ "$attempt" = 30 ] && { echo "::error::release $TAG never appeared"; exit 1; }
            echo "release $TAG does not exist yet (attempt $attempt/30); waiting"
            sleep 10
          done
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber \
            "${{ steps.pack.outputs.tarball }}" ocpp-cp-simulator.tgz

  # Points `cli-latest` at the highest published CLI release, then installs
  # from the URL the documentation advertises.
  #
  # Serialised only to stop two `--clobber` uploads of the same asset from
  # interleaving. It is NOT what makes the pointer correct, and it must not be:
  # GitHub keeps one pending job per group and replaces it with the most
  # recently QUEUED one, and queue order here is release-completion order, not
  # version order — so a slow rerun of an older tag can evict a newer tag's
  # pending job. That is survivable only because the script converges on the
  # highest published release rather than on the version that triggered it:
  # whichever job survives reaches the same state, and a cancelled one costs
  # nothing. `cancel-in-progress: false` so a move already under way finishes
  # rather than leaving a half-written pointer.
  roll-pointer:
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: cli-latest-pointer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      # The script decides which release the pointer should serve (the highest
      # published vX.Y.Z, not necessarily the one that triggered this run)
      # and downloads that release's own asset, so the bytes the pointer serves
      # are provably the bytes that release published. See its header for the
      # contract and for why every failure mode in it points the safe way.
      - name: Move the rolling `cli-latest` pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          ./scripts/roll-cli-latest.sh \
            "${{ needs.release.outputs.version }}" \
            "${{ needs.release.outputs.tag }}"

      # The documented install command, executed. Everything in the publish job
      # verifies a LOCAL tarball; this is the only step that proves the URL
      # README.md and docs/entities/cli.md tell people to run actually resolves
      # and installs — the defect in #321 was a URL, not an artifact.
      - name: Verify the documented install URL
        run: |
          set -euo pipefail
          URL="https://github.com/${{ github.repository }}/releases/download/cli-latest/ocpp-cp-simulator.tgz"
          # Asset propagation after upload is not instant; retry briefly.
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$URL" -o rolling.tgz; then break; fi
            [ "$attempt" = 5 ] && { echo "::error::$URL never became downloadable"; exit 1; }
            echo "download failed (attempt $attempt/5); retrying"
            sleep 10
          done
          ./scripts/verify-cli-tarball.sh --expect-dist rolling.tgz

  # Publishes the release's tarball to the npm registry as `ocpp-cp-simulator`,
  # so `npm install -g ocpp-cp-simulator` / `npx ocpp-cp-simulator` resolve.
  #
  # - Gated on the repository variable NPM_PUBLISH=true, which is set once the
  #   package exists on npm and has this workflow registered as a trusted
  #   publisher (npmjs.com → package → Settings → Trusted publishing). Until
  #   then the job is skipped and the GitHub release is unaffected; the first
  #   version is published by hand from the release's tarball.
  # - Authenticates with the job's OIDC token (`id-token: write`), no secret:
  #   npm exchanges it for a short-lived publish token and attaches a
  #   provenance attestation. Needs npm ≥ 11.5.1, hence the self-upgrade.
  # - Publishes the asset the GitHub release carries, downloaded by tag, so the
  #   bytes on npm are the bytes the release published — never a re-pack.
  # - Idempotent: a re-run of a tag whose version is already on npm skips
  #   instead of failing on the registry's 403.
  # - A SemVer prerelease (`v1.0.0-rc.1`) goes under the `next` dist-tag,
  #   so `npm install ocpp-cp-simulator` never resolves to one — the same
  #   carve-out `cli-latest` makes.
  publish-npm:
    needs: release
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (trusted publishing needs ≥ 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Download the release's tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "ocpp-cp-simulator-${VERSION}.tgz"
          ls -lh "ocpp-cp-simulator-${VERSION}.tgz"

      - name: Publish to npm
        run: |
          set -euo pipefail
          if [ -n "$(npm view "ocpp-cp-simulator@${VERSION}" version 2>/dev/null)" ]; then
            echo "::notice::ocpp-cp-simulator@${VERSION} is already on npm; nothing to publish"
            exit 0
          fi
          DIST_TAG=latest
          case "$VERSION" in *-*|*+*) DIST_TAG=next ;; esac
          npm publish "ocpp-cp-simulator-${VERSION}.tgz" --access public --tag "$DIST_TAG"
          npm view "ocpp-cp-simulator@${VERSION}" version
