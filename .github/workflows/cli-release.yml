name: Release CLI

# Builds the CLI + bundled web console and uploads an npm-style tarball
# (`ocpp-cp-simulator-<version>.tgz`) to a GitHub Release. End users then
# install with e.g.
#
#   bun install -g https://github.com/shiv3/ocpp-cp-simulator/releases/download/cli-latest/ocpp-cp-simulator.tgz
#
# `cli-latest` is a rolling pre-release this workflow re-points at every CLI
# release (see the "rolling cli-latest pointer" step). It exists because this
# repository has two tag trains — `v*` (desktop) and `cli-v*` (CLI) — and
# GitHub's `releases/latest` resolves across BOTH, so it lands on a desktop
# release, which carries no `.tgz`, for roughly half of every release cycle
# (#321). The rolling tag is scoped to the CLI train and so is always right.
#
# The tarball respects the `files` field in package.json, which lists every
# top-level directory the CLI's import graph reaches plus the freshly-built
# `dist/`. Keep it a list of DIRECTORIES: enumerating individual files is what
# shipped a tarball that could not start (#320). `dist/` is deliberately kept
# out of git — devDependencies aren't installed for global bin packages, so a
# postinstall build isn't viable, which is why we ship a prebuilt tarball.

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0) — creates tag cli-v<version>"
        required: true
        type: string

permissions:
  contents: write

# NOTE: there is deliberately NO workflow-level `concurrency:` here. GitHub's
# concurrency cancels the *pending* run whenever a newer one enters the group,
# and `cancel-in-progress: false` only protects the run that is already
# executing — not the queue behind it. With three CLI releases queued, the
# middle tag would be cancelled and would never publish its own `cli-v*`
# assets, which ARE the release. Only the pointer-move job below is serialised;
# see the comment on its `concurrency:` block for why cancelling that one is
# harmless.

jobs:
  # Publishes the per-tag `cli-v*` release. Never cancellable, never gated on
  # anything else: its assets are the release.
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Node (for `npm pack`)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="cli-v${VERSION}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#cli-v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web console (vite)
        run: bun run build

      - name: Stamp package version
        run: npm version --no-git-tag-version --allow-same-version "${{ steps.version.outputs.version }}"

      - name: Pack tarball
        id: pack
        run: |
          # `npm pack` reads the `files` field of package.json, which lists
          # `dist` plus every src/ directory (and `vendor/`, `schema/`) the
          # CLI imports. --ignore-scripts skips the `prepack` hook (vite build) — we
          # already built dist/ in the previous step, and letting prepack
          # run again pollutes the captured stdout with vite's build log,
          # which breaks the $TARBALL capture below.
          TARBALL=$(npm pack --silent --ignore-scripts)
          # Also publish under a stable filename so consumers can fetch
          # `releases/download/cli-latest/ocpp-cp-simulator.tgz` and always
          # get the newest CLI without knowing the version string.
          cp "${TARBALL}" ocpp-cp-simulator.tgz
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          ls -lh "${TARBALL}" ocpp-cp-simulator.tgz

      # This used to be three `tar -tf | grep` steps asserting that named
      # files (src/protocol/, src/scenario/scenarioSchemaValidator.ts,
      # schema/scenario.schema.json) were in the listing. All three passed on
      # a tarball that could not run at all, because `files` omitted src/data,
      # src/ocpp, src/trace and vendor/ — paths no grep named (#320). A
      # presence check can only ever catch the omissions someone already
      # thought of. This installs the tarball into a throwaway global prefix
      # and boots it instead: --help, the full import graph, the daemon's
      # /v1/healthz, and the bundled web console. --expect-dist makes the
      # web-console stage mandatory here (we ran `bun run build` above, so a
      # tarball without dist/ means `files` lost it).
      - name: Verify the tarball installs and runs
        run: ./scripts/verify-cli-tarball.sh --expect-dist "${{ steps.pack.outputs.tarball }}"

      - name: Create / update release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CLI ${{ steps.version.outputs.tag }}
          files: |
            ${{ steps.pack.outputs.tarball }}
            ocpp-cp-simulator.tgz
          generate_release_notes: true
          body: |
            Prebuilt CLI bundle including the web console (`dist/`).

            ### Install

            Pin to this release:

            ```sh
            bun install -g https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/${{ steps.pack.outputs.tarball }}
            ```

            Or always pull the latest CLI release (`cli-latest` is a rolling
            pointer this workflow re-points at every CLI release; the repo's
            `releases/latest` cannot be used because it resolves across the
            desktop `v*` train too — see #321):

            ```sh
            bun install -g https://github.com/${{ github.repository }}/releases/download/cli-latest/ocpp-cp-simulator.tgz
            ```

            Then run e.g.

            ```sh
            ocpp-cp-sim --http-port 5172 \
                        --cp-id my-cp --connectors 5 \
                        --web-console \
                        --ws-url wss://example.com/chargepoint/
            ```

  # Moves the rolling `cli-latest` pointer onto the release the job above just
  # published, then installs from the URL the documentation advertises.
  #
  # Serialised, because scripts/roll-cli-latest.sh is a read-then-write (read
  # the version the pointer holds, refuse to go backwards, write the asset and
  # the marker) and two of these interleaving could leave the pointer serving
  # the older package. Unlike the publish job, cancelling this one is harmless
  # and in fact correct: a pointer move superseded by a newer release's pointer
  # move had nothing to contribute — the rollback guard in the script would
  # have refused it anyway. `cancel-in-progress: false` so a move already
  # under way still finishes rather than leaving a half-written pointer.
  roll-pointer:
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: cli-latest-pointer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      # Taken from the release the previous job published rather than passed
      # between jobs as an artifact: this way the bytes the pointer serves are
      # provably the bytes that release published.
      - name: Fetch the published tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "${{ needs.release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern ocpp-cp-simulator.tgz --clobber
          ls -lh ocpp-cp-simulator.tgz

      # See scripts/roll-cli-latest.sh for what the pointer is for, why it is a
      # pre-release, and why every failure mode in it points the safe way.
      # Skipping the move (an older tag re-run) is a `::notice::`, not a
      # failure: that run still published its own `cli-v*` assets correctly.
      - name: Move the rolling `cli-latest` pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          ./scripts/roll-cli-latest.sh \
            "${{ needs.release.outputs.version }}" \
            "${{ needs.release.outputs.tag }}" \
            ocpp-cp-simulator.tgz

      # The documented install command, executed. Everything in the publish job
      # verifies a LOCAL tarball; this is the only step that proves the URL
      # README.md and docs/entities/cli.md tell people to run actually resolves
      # and installs — the defect in #321 was a URL, not an artifact.
      - name: Verify the documented install URL
        run: |
          set -euo pipefail
          URL="https://github.com/${{ github.repository }}/releases/download/cli-latest/ocpp-cp-simulator.tgz"
          # Asset propagation after upload is not instant; retry briefly.
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$URL" -o rolling.tgz; then break; fi
            [ "$attempt" = 5 ] && { echo "::error::$URL never became downloadable"; exit 1; }
            echo "download failed (attempt $attempt/5); retrying"
            sleep 10
          done
          ./scripts/verify-cli-tarball.sh --expect-dist rolling.tgz
