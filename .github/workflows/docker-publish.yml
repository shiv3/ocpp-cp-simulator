name: Build & publish Docker image

# Multi-arch (amd64 + arm64) build of the bundled daemon + web console
# image, published to GitHub Container Registry under
# ghcr.io/<owner>/<repo>. Triggers:
#   - push to `main`                       → `main` + `sha-<short>` + `latest`
#   - push to `feat/browser-remote-mode`   → branch-slug + `sha-<short>` (no `latest`)
#   - push of a `vX.Y.Z` tag               → `X.Y.Z` + `X.Y` + `X` (semver pins)
#   - manual via workflow_dispatch         → same as the triggering branch
#
# We deliberately do NOT build on every PR or every feature branch:
# Docker layers take time + cache space, and the active branch already
# rebuilds on every push. Versioned releases come from `vX.Y.Z` tags
# (same tags that `release.yml` cuts for the desktop app), giving
# reproducible image pins like `ghcr.io/<owner>/<repo>:1.2.3`. `latest`
# stays pinned to `main` (bleeding edge), not to the newest release.

on:
  push:
    branches:
      # Default branch — every merge produces a `latest` image.
      - main
      # Active feature branch — pushes here get an image tagged with the
      # branch slug + commit sha so we can test changes without merging.
      - feat/browser-remote-mode
    tags:
      # Semver release tags — publish immutable `X.Y.Z` / `X.Y` / `X`
      # image pins for reproducible deployments (issue #72).
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only tag-triggered semver releases get stamped; branch builds stay
      # 0.0.0 (web console footer hides the version). The build context is
      # the checkout, so the Dockerfile's UI stage picks up the stamped
      # package.json and Vite bakes the version into the bundle (issue #93).
      - name: Setup Node (for version stamping)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Resolve version
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Stamp package version
        if: startsWith(github.ref, 'refs/tags/')
        run: npm version --no-git-tag-version --allow-same-version "${{ steps.version.outputs.version }}"

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` deliberately tracks the default branch (bleeding edge),
          # NOT the newest semver tag — so disable metadata-action's built-in
          # "latest on semver" behaviour and set `latest` ourselves below.
          flavor: |
            latest=false
          tags: |
            # main       → `main` + `sha-<short>` + `latest`
            # feat/...   → branch-slug + `sha-<short>` (no `latest`)
            # v1.2.3 tag → `1.2.3` + `1.2` + `1` (semver release pins)
            #
            # `sha-<short>` is branch-builds ONLY: a `vX.Y.Z` tag build runs a
            # version-stamped rebuild of the same commit, and without the
            # enable guard it would push the same `sha-<short>` tag a second
            # time and clobber the branch image the sha pin already points at
            # (last writer wins — happened on v0.7.4).
            type=ref,event=branch
            type=sha,format=short,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Speed up rebuilds by sharing layers across runs. GitHub Actions
          # cache is local to the repo so it's safe to write back.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # #287: "Build & push" succeeding is not the same fact as the tags being
      # in the registry, and the release notes promise the registry. v0.7.6
      # published notes saying `ghcr.io/...:0.7.6` existed while the build had
      # failed, and the gap was invisible from GitHub -- the tag was there, the
      # release page looked complete, and only a registry query said otherwise
      # (0.7.1 went the same way and was never republished). #282 removed one
      # cause, a flaky tarball; this covers the class -- a genuine build
      # failure, a registry outage, a permissions change, an action bump that
      # silently pushes nothing.
      #
      # Tag builds only: a branch build promises nobody anything, and `latest`
      # moving is not a claim in a release note.
      - name: Verify the pushed tags resolve
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          missing=0
          # steps.meta.outputs.tags is newline-separated, one image ref per line.
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            if docker buildx imagetools inspect "$tag" >/dev/null 2>&1; then
              echo "ok       $tag"
            else
              echo "::error::$tag was not published -- the release notes promise it"
              missing=$((missing + 1))
            fi
          done <<< "${{ steps.meta.outputs.tags }}"
          if [ "$missing" -ne 0 ]; then
            echo "$missing tag(s) missing from the registry." >&2
            exit 1
          fi
