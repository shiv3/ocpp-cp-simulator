name: E2E

# #624: the gocpp end-to-end suite (e2e/README.md) needs Go and takes a few
# minutes, and it is not part of CI, so a regression against the independent
# CSMS was found only when someone ran it locally. This workflow runs it on a
# schedule, and by hand from the Actions tab. The CSMS under test is gocpp's
# cmd/gocpp-csms at the version pinned in e2e/gocpp-csms.version, so a red run
# means the simulator changed, not the oracle.
on:
  schedule:
    # Mondays 03:17 UTC, off the hour.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  gocpp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Where e2e/support/gocppCsms.ts writes the fixture's trace.
      E2E_TRACE_DIR: ${{ github.workspace }}/e2e-traces
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      # e2e/support/buildCsms.ts runs `go install` of the pinned CSMS; the
      # module cache is keyed on the pin file. 1.26.0 is the minimum gocpp's
      # go.mod declares.
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.0"
          cache-dependency-path: e2e/gocpp-csms.version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # @open-ocpp-trace/* is on GitHub Packages (bunfig.toml).
          GITHUB_TOKEN: ${{ github.token }}

      - name: gocpp e2e suites
        run: bun run test:e2e

      # What the fixture received (NDJSON, in receive order) and wrote to
      # stderr, one pair of files per fixture process.
      - name: Keep the traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: e2e-traces/
          if-no-files-found: warn
          retention-days: 30
